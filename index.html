<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Analisador de Loterias</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dracula-theme.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- Botão de alternância de tema -->
  <button class="toggle-theme-btn" id="toggleTheme" onclick="tema.alternarTema()">
    🌙 Modo Escuro
  </button>

  <h1>📊 Analisador Estatístico de Loterias</h1>
  
  <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
    <label>Escolha a loteria:</label>
    <select id="loteria">
      <option value="megasena" selected>Mega-Sena</option>
      <option value="lotofacil">Lotofácil</option>
    </select>
    <button onclick="atualizarDados()" style="padding: 6px 12px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer;">
      🔄 Atualizar Dados
    </button>
  </div>
  <nav>
    <a href="#" onclick="carregar('ultimos', document.getElementById('loteria').value)">Últimos Sorteios</a>
    <a href="#" onclick="carregar('frequencia', document.getElementById('loteria').value)">Frequência por Coluna</a>
  </nav>

  <div id="conteudo"></div>

  <hr style="margin: 30px 0;">

  <h2>🔍 Comparador de Jogos</h2>
  <p>Digite seus números (separados por vírgula) e veja as estatísticas:</p>

  <div style="display: flex; gap: 10px; flex-wrap: wrap;">
    <input type="text" id="inputNumeros" placeholder="Ex: 5,12,23,34,45,58" style="flex: 1; min-width: 200px; padding: 8px; border-radius: 4px; border: 1px solid #ddd;">
    <button onclick="controllers.comparador.comparar()" style="padding: 8px 20px; border-radius: 4px; border: none; background: #2c3e50; color: white; cursor: pointer;">Comparar</button>
  </div>

  <div id="resultadoComparador" style="margin-top: 20px;"></div>

  <hr style="margin: 30px 0;">

  <h2>🎯 Gerar Apostas Inteligentes</h2>
  <p>Escolha o nível de risco e veja os jogos gerados pelo algoritmo.</p>

  <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
    <label>Nível de risco:</label>
    <select id="nivelRisco">
      <option value="baixo">🔵 Baixo (mais filtros)</option>
      <option value="medio" selected>🟡 Médio (equilibrado)</option>
      <option value="alto">🔴 Alto (menos filtros)</option>
    </select>

    <button onclick="controllers.gerador.gerar()" style="padding: 8px 20px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer;">🎲 Gerar Apostas</button>
  </div>

  <div id="resultadoGeracao" style="margin-top: 20px;"></div>

  <script src="js/utils/formatadores.js"></script>
  <script src="js/utils/tema.js"></script>
  <script src="js/models/api.js"></script>
  <script src="js/views/tabelas.js"></script>
  <script src="js/views/graficos.js"></script>
  <script src="js/views/geracao.js"></script>
  <script src="js/controllers/comparadorController.js"></script>
  <script src="js/controllers/geradorController.js"></script>
  <script src="js/controllers/atualizacaoController.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
